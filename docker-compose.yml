services:
  tft-helper:
    build: .
    container_name: tft-helper-ai
    ports:
      - "3000:3000"
    env_file:
      - .env.local        # chứa GEMINI_API_KEY (không commit file này)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
