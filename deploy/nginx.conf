# Nginx reverse proxy cho TFT Helper AI
# Copy ra /etc/nginx/sites-available/tft-helper rồi:
#   sudo ln -s /etc/nginx/sites-available/tft-helper /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Certbot sẽ tự sửa file này khi chạy `certbot --nginx` để thêm phần 443/SSL.

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;   # <-- ĐỔI thành domain hoặc IP của bạn

    # Kích thước tối đa request (chat chỉ gửi text nên nhỏ là đủ)
    client_max_body_size 2m;

    # Gzip cho file text
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Static assets (hash trong tên file) — cache dài hạn
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API chat — BẬT streaming (SSE): tắt buffering, tăng timeout đọc
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;          # bắt buộc để chat stream mượt
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Toàn bộ trang còn lại
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Sau khi chạy certbot, block 443 với ssl_certificate sẽ được thêm tự động.
# Nếu muốn viết tay, tham khảo:
# server {
#     listen 443 ssl http2;
#     server_name your-domain.com;
#     ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
#     ... (copy các location ở trên vào đây)
# }
